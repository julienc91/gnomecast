[project]
name = "gnomecast"
dynamic = ["version"]
description = "A native Linux GUI for Chromecasting local files."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "Derek Anderson", email = "public@kered.org" }
]
urls = { Homepage = "https://github.com/keredson/gnomecast" }
requires-python = ">=3.11"
dependencies = [
    "bottle~=0.13.3",
    "dbus-python>=1.4.0",
    "html5lib~=1.1",
    "paste~=3.10.1",
    "pycaption~=2.3.8",
    "pychromecast~=14.0.10",
    "pygobject~=3.56.3",
    "typing-extensions>=4.12",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gnomecast/version.py"

[project.gui-scripts]
gnomecast = "gnomecast:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pygobject-stubs>=2.17.0",
    "ruff>=0.11.13",
    "ty>=0.0.74",
]

[tool.ty.rules]
all = "error"

[tool.ty.src]
# test_gnomecast.py predates the module split into main.py/metadata.py/etc.
# and calls an API that no longer exists; it's already broken independent
# of type checking, so it's excluded here rather than rewritten.
exclude = ["tests"]

[tool.uv]
config-settings-package = { pygobject-stubs = { config = "Gtk3,Gdk3" } }
